name: Build Android APK & Upload Artifact

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # NOTE: If your project files are inside a subfolder like 'CA-partner-main', 
      # we change directory into it before running gradle commands.
      - name: Grant execute permission for gradlew
        run: |
          cd CA-partner-main # Change this if your folder name is different
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd CA-partner-main
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: CA-partner-main/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          
