name: Build Android APK & Upload Artifact

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inspect Workspace & Build APK
        run: |
          echo "=== Listing Repository Root Contents ==="
          ls -la
          
          # Check if gradlew is in root, if not search everywhere
          if [ -f "./gradlew" ]; then
            echo "Found gradlew in root!"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew not in root, searching subdirectories..."
            GRADLEW_FILE=$(find . -name "gradlew" -type f | head -n 1)
            
            if [ -z "$GRADLEW_FILE" ]; then
              echo "CRITICAL ERROR: No gradlew file found anywhere in the repository!"
              echo "Make sure you committed your Android project files properly."
              exit 1
            fi
            
            PROJECT_DIR=$(dirname "$GRADLEW_FILE")
            echo "Found project directory at: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 7
          
