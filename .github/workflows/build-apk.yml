name: Build Android APK & Upload Artifact

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle Wrapper & Build APK
        run: |
          echo "Installing system Gradle to generate missing wrapper..."
          sudo apt-get update
          sudo apt-get install -y gradle
          
          # Automatically find where build.gradle.kts is located
          BUILD_FILE=$(find . -name "build.gradle.kts" -maxdepth 3 | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Target project directory: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          
          echo "Generating gradlew wrapper..."
          gradle wrapper
          
          echo "Building Debug APK..."
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 7
          
