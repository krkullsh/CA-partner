name: Build Android APK & Upload Artifact

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with Gradle 9.3.1
        run: |
          # Generate a compatible wrapper matching Gradle 9.3.1 as required by your plugin
          if [ ! -f "./gradlew" ]; then
            echo "Generating wrapper using gradle 9.3.1..."
            gradle wrapper --gradle-version 9.3.1
          else
            # Update existing wrapper to 9.3.1
            ./gradlew wrapper --gradle-version 9.3.1
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 7
          
