name: Build Android APK & Upload Artifact

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Persistent V6 Signing Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f app/calab-v6.keystore ]; then
            echo "Generating permanent V6 keystore for seamless future updates..."
            keytool -genkeypair -v \
              -keystore app/calab-v6.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/calab-v6.keystore
            git commit -m "chore(v6): lock persistent signing keystore for seamless app updates [skip ci]" || true
            git push origin HEAD:main || true
          else
            echo "Reusing existing persistent V6 keystore (app/calab-v6.keystore)..."
          fi
          cp app/calab-v6.keystore debug.keystore
          cp app/calab-v6.keystore app/debug.keystore
          cp app/calab-v6.keystore ~/.android/debug.keystore

      - name: Build V6 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload V6 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CA-Lab-V6-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
