name: Build Android APK & Upload Artifact

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          # Ensure wrapper is set to 9.3.1
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          else
            ./gradlew wrapper --gradle-version 9.3.1
          fi
          
          chmod +x gradlew
          
          # Build package using assembleDebug and bypass signing validation if needed
          ./gradlew assembleDebug -x validateSigningDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 7
          
