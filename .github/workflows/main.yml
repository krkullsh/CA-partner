name: Build Android APK & Upload Artifact

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to trigger the build manually from GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java JDK 17 (Required for modern Android projects)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Grant execute permissions to the Gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Build the Debug APK using Gradle
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. Upload the compiled APK as a downloadable GitHub Artifact (v4)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7 # Optional: Keeps the artifact available for 7 days
          
